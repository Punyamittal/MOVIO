<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Voice Translation Phone</title>
  <style>
    :root {
      --bg: #101820;
      --ink: #f2f5f8;
      --mute: #9aabbc;
      --ok: #3dd68c;
      --bad: #f07178;
      --warn: #e6b450;
      --line: #2a3542;
      --accent: #39bae6;
      --hold: #e6b450;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(165deg, #15202b, #0d1218 60%);
      color: var(--ink);
      padding: 1rem 1rem 2rem;
    }
    .wrap { max-width: 26rem; margin: 0 auto; }
    h1 {
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      margin: 0.25rem 0 0.15rem;
    }
    .role {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0.5rem 0 1rem;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      background: rgba(255,255,255,0.03);
      margin-bottom: 0.75rem;
    }
    .row { display: flex; justify-content: space-between; gap: 0.5rem; margin: 0.35rem 0; font-size: 0.92rem; }
    .label { color: var(--mute); }
    .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; display: inline-block; background: var(--bad); margin-right: 0.35rem; }
    .dot.on { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    select, .mode-btn {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0c1218;
      color: var(--ink);
      font: inherit;
    }
    .mode-row { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
    .mode-row button {
      flex: 1;
      padding: 0.45rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0c1218;
      color: var(--mute);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .mode-row button.on { background: var(--accent); color: #041018; border-color: var(--accent); }
    .hold {
      width: 100%;
      margin-top: 0.75rem;
      border: 0;
      border-radius: 999px;
      padding: 1.15rem 1rem;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: var(--hold);
      color: #1a1408;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .hold:disabled { opacity: 0.45; }
    .hold.active { background: var(--bad); color: #fff; }
    .hold.listening { background: #2d6a4f; color: #fff; }
    .msg {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--mute);
      white-space: pre-wrap;
    }
    .msg.err { color: var(--bad); }
    .lat { font-size: 0.8rem; color: var(--mute); margin-top: 0.5rem; }
    button.secondary {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: inherit;
    }
    .fsm {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.72rem;
      color: var(--accent);
      text-align: center;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Voice Translation</h1>
    <div class="role" id="roleLabel">PHONE —</div>
    <div class="fsm" id="fsmLabel">FSM: IDLE</div>

    <div class="card">
      <div class="row"><span class="label">Status</span><span id="status"><span class="dot"></span>Connecting…</span></div>
      <div class="row"><span class="label">Partner</span><span id="partner">—</span></div>
      <div class="row"><span class="label">Microphone</span><span id="mic"><span class="dot"></span>Idle</span></div>
      <div class="row"><span class="label">Translated audio</span><span id="recv"><span class="dot"></span>Waiting</span></div>
      <div class="row"><span class="label">Echo gate</span><span id="echo"><span class="dot"></span>Off</span></div>
    </div>

    <div class="card">
      <div class="label">Input language (you speak)</div>
      <select id="inLang">
        <option value="en">English (en)</option>
        <option value="tanglish">Tanglish</option>
        <option value="ta">Tamil (ta)</option>
        <option value="auto">Auto-detect</option>
      </select>
      <div class="label" style="margin-top:0.65rem">Output language (partner hears)</div>
      <select id="outLang">
        <option value="tanglish">Tanglish</option>
        <option value="ta">Tamil (ta)</option>
        <option value="en">English (en)</option>
      </select>
      <div class="label" style="margin-top:0.65rem">Capture mode</div>
      <div class="mode-row">
        <button type="button" id="modeVad" class="on">Continuous VAD</button>
        <button type="button" id="modePtt">Hold to speak</button>
      </div>
    </div>

    <button type="button" class="hold" id="holdBtn" disabled>ENABLE LISTENING</button>
    <button type="button" class="secondary" id="unlockBtn">Tap to enable microphone / audio</button>
    <button type="button" class="secondary" id="retryBtn" style="display:none">Retry last utterance</button>
    <button type="button" class="secondary" id="playRecvBtn" style="display:none">Tap to play received audio</button>
    <audio id="recvAudio" playsinline webkit-playsinline></audio>

    <div class="msg" id="msg">Connecting to laptop server…</div>
    <div class="lat" id="lat"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const parts = location.pathname.split("/").filter(Boolean);
    const sessionId = parts[1];
    const role = (parts[2] || "").toUpperCase();
    const token = params.get("token") || "";

    const $ = (id) => document.getElementById(id);
    $("roleLabel").textContent = "PHONE " + role;

    if (role === "A") {
      $("inLang").value = "en";
      $("outLang").value = "tanglish";
    } else if (role === "B") {
      $("inLang").value = "tanglish";
      $("outLang").value = "en";
    }

    // --- Tunables (half-duplex reliability over latency) ---
    const VAD_SPEECH_RMS = 0.018;
    const VAD_BARGE_RMS = 0.045; // louder than echo to barge-in
    const VAD_SILENCE_MS = 900;
    const VAD_MIN_SPEECH_MS = 200;
    const VAD_PREFIX_MS = 180;

    let ws = null;
    let connected = false;
    let mediaStream = null;
    let audioCtx = null;
    let processor = null;
    let sourceNode = null;
    let muteGain = null;
    let continuous = false;
    let mode = "vad"; // vad | ptt
    let recording = false; // PTT active
    let pcmChunks = [];
    let sampleRate = 16000;
    let latencies = [];
    let playQueue = Promise.resolve();
    let audioUnlocked = false;
    let pendingRecv = null;
    let echoSuppress = false;
    let fsmState = "IDLE";
    let youMaySpeak = true;
    let activePlayUtterance = null;
    let currentAudioSrc = null;
    let lastFailedUtteranceId = null;
    let seenUtteranceIds = new Set();
    let reconnectGeneration = 0;

    // VAD state
    let vadSpeaking = false;
    let vadSpeechMs = 0;
    let vadSilenceMs = 0;
    let vadUtteranceId = null;
    let vadStartTime = 0;
    let vadRing = [];
    let vadRingMs = 0;
    let claimAccepted = false;

    function uuidUtterance() {
      return "utt-" + Math.random().toString(16).slice(2) + Date.now().toString(16).slice(-4);
    }

    function setStatus(text, cls) {
      const dotCls = cls === "on" ? "on" : cls === "warn" ? "warn" : "";
      $("status").innerHTML = `<span class="dot ${dotCls}"></span>${text}`;
    }
    function setMic(active) {
      $("mic").innerHTML = `<span class="dot ${active ? "on" : ""}"></span>${active ? "Active" : "Idle"}`;
    }
    function setRecv(active) {
      $("recv").innerHTML = `<span class="dot ${active ? "on" : ""}"></span>${active ? "Receiving" : "Waiting"}`;
    }
    function setEcho(on) {
      echoSuppress = !!on;
      $("echo").innerHTML = `<span class="dot ${on ? "warn" : ""}"></span>${on ? "ON (ignore TTS)" : "Off"}`;
    }
    function setFsm(state) {
      fsmState = state || "IDLE";
      $("fsmLabel").textContent = "FSM: " + fsmState;
    }
    function message(text, err) {
      $("msg").textContent = text;
      $("msg").className = "msg" + (err ? " err" : "");
    }
    function updateHoldLabel() {
      const btn = $("holdBtn");
      if (mode === "ptt") {
        btn.textContent = recording ? "RECORDING… RELEASE TO SEND" : "HOLD TO SPEAK";
        btn.classList.toggle("active", recording);
        btn.classList.remove("listening");
      } else {
        btn.textContent = continuous ? "LISTENING… (tap to pause)" : "ENABLE LISTENING";
        btn.classList.toggle("listening", continuous);
        btn.classList.toggle("active", vadSpeaking);
      }
    }

    function b64ToUint8(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function sniffMime(bytes, fmt) {
      const f = (fmt || "").toLowerCase();
      if (f === "mp3" || f === "mpeg" || f === "audio/mpeg") return "audio/mpeg";
      if (f === "wav" || f === "wave" || f === "audio/wav") return "audio/wav";
      if (bytes.length >= 3 && bytes[0] === 0xff && (bytes[1] & 0xe0) === 0xe0) return "audio/mpeg";
      if (bytes.length >= 3 && bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) return "audio/mpeg";
      if (bytes.length >= 4 && bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46) return "audio/wav";
      return "audio/mpeg";
    }

    async function unlockAudio() {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") {
        try { await audioCtx.resume(); } catch (_) {}
      }
      try {
        const buf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate || 22050);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start(0);
      } catch (_) {}
      try {
        const a = $("recvAudio");
        a.muted = true;
        a.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
        await a.play().catch(() => {});
        a.pause();
        a.muted = false;
        a.removeAttribute("src");
        a.load();
      } catch (_) {}
      audioUnlocked = true;
    }

    function stopLocalTts(reason) {
      try {
        const audio = $("recvAudio");
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
      } catch (_) {}
      if (currentAudioSrc) {
        try { currentAudioSrc.stop(); } catch (_) {}
        currentAudioSrc = null;
      }
      setRecv(false);
      setEcho(false);
      if (activePlayUtterance && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: reason === "failed" ? "tts_failed" : "tts_done",
          utterance_id: activePlayUtterance,
          reason: reason || "stopped",
        }));
      }
      activePlayUtterance = null;
    }

    function playViaElement(url) {
      return new Promise((resolve, reject) => {
        const audio = $("recvAudio");
        const done = (ok, err) => {
          audio.onended = null;
          audio.onerror = null;
          if (ok) resolve();
          else reject(err || new Error("audio element failed"));
        };
        audio.onended = () => done(true);
        audio.onerror = () => done(false, new Error("audio element error"));
        audio.playsInline = true;
        audio.setAttribute("playsinline", "true");
        audio.setAttribute("webkit-playsinline", "true");
        audio.preload = "auto";
        audio.src = url;
        audio.load();
        const p = audio.play();
        if (p && typeof p.then === "function") {
          p.then(() => {}).catch((err) => done(false, err));
        }
      });
    }

    function playViaWebAudio(bytes) {
      return new Promise(async (resolve, reject) => {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") await audioCtx.resume();
          const copy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const decoded = await audioCtx.decodeAudioData(copy);
          const src = audioCtx.createBufferSource();
          src.buffer = decoded;
          src.connect(audioCtx.destination);
          currentAudioSrc = src;
          src.onended = () => { currentAudioSrc = null; resolve(); };
          src.start(0);
        } catch (err) {
          reject(err);
        }
      });
    }

    function showPlayFallback(url, mime, text, utteranceId) {
      if (pendingRecv && pendingRecv.url) {
        try { URL.revokeObjectURL(pendingRecv.url); } catch (_) {}
      }
      pendingRecv = { url, mime, text, utteranceId };
      $("playRecvBtn").style.display = "block";
      message(
        (text ? text + "\n\n" : "") +
        "Audio is ready but the phone blocked autoplay.\nTap “Tap to play received audio”.",
        true
      );
    }

    function playBase64Audio(b64, fmt, text, utteranceId) {
      if (utteranceId && seenUtteranceIds.has(utteranceId + ":played") && reconnectGeneration > 0) {
        // Avoid replaying stale audio after reconnect
        message("Skipped stale TTS after reconnect.");
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "tts_done", utterance_id: utteranceId, reason: "stale_skipped" }));
        }
        return;
      }
      if (!b64) {
        message((text || "Partner speech") + "\n\n(No audio bytes — text only)", true);
        if (ws && ws.readyState === 1 && utteranceId) {
          ws.send(JSON.stringify({ type: "tts_failed", utterance_id: utteranceId }));
        }
        return;
      }
      const bytes = b64ToUint8(b64);
      if (!bytes.length) {
        message((text || "Partner speech") + "\n\n(Empty audio)", true);
        return;
      }
      const mime = sniffMime(bytes, fmt);
      const blob = new Blob([bytes], { type: mime });
      const url = URL.createObjectURL(blob);
      setRecv(true);
      setEcho(true);
      activePlayUtterance = utteranceId || null;
      if (utteranceId) seenUtteranceIds.add(utteranceId + ":played");
      if (ws && ws.readyState === 1 && utteranceId) {
        ws.send(JSON.stringify({ type: "tts_started", utterance_id: utteranceId }));
      }
      playQueue = playQueue.then(async () => {
        try {
          await unlockAudio();
          try {
            await playViaElement(url);
          } catch (elErr) {
            await playViaWebAudio(bytes);
          }
          $("playRecvBtn").style.display = "none";
          if (pendingRecv && pendingRecv.url === url) pendingRecv = null;
          else URL.revokeObjectURL(url);
          setRecv(false);
          setEcho(false);
          if (ws && ws.readyState === 1 && utteranceId) {
            ws.send(JSON.stringify({ type: "tts_done", utterance_id: utteranceId }));
          }
          activePlayUtterance = null;
        } catch (err) {
          setRecv(false);
          setEcho(false);
          showPlayFallback(url, mime, text || "Partner speech", utteranceId);
          if (ws && ws.readyState === 1 && utteranceId) {
            ws.send(JSON.stringify({ type: "tts_failed", utterance_id: utteranceId, error: String(err) }));
          }
          activePlayUtterance = null;
        }
      });
    }

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      return `${proto}://${location.host}/test/ws/phone/${sessionId}/${role}?token=${encodeURIComponent(token)}`;
    }

    async function ensureMic() {
      if (mediaStream) return mediaStream;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("This browser does not support microphone access.");
      }
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          channelCount: 1,
        },
        video: false,
      });
      return mediaStream;
    }

    function downsampleTo16k(float32, inRate) {
      if (inRate === 16000) return float32;
      const ratio = inRate / 16000;
      const outLen = Math.floor(float32.length / ratio);
      const out = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) out[i] = float32[Math.floor(i * ratio)];
      return out;
    }

    function floatTo16BitPCM(float32) {
      const buf = new ArrayBuffer(float32.length * 2);
      const view = new DataView(buf);
      for (let i = 0; i < float32.length; i++) {
        let s = Math.max(-1, Math.min(1, float32[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return new Uint8Array(buf);
    }

    function encodeWav(pcm16, rate) {
      const buffer = new ArrayBuffer(44 + pcm16.length);
      const view = new DataView(buffer);
      const writeStr = (off, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
      };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + pcm16.length, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, rate, true);
      view.setUint32(28, rate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, pcm16.length, true);
      new Uint8Array(buffer, 44).set(pcm16);
      return buffer;
    }

    function b64FromArrayBuffer(buf) {
      const bytes = new Uint8Array(buf);
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function rmsOf(float32) {
      let s = 0;
      for (let i = 0; i < float32.length; i++) s += float32[i] * float32[i];
      return Math.sqrt(s / Math.max(1, float32.length));
    }

    function sendUtteranceFromChunks(chunks, utteranceId, startTime) {
      if (!chunks.length) {
        message("No audio captured.", true);
        return;
      }
      let total = 0;
      for (const c of chunks) total += c.length;
      const merged = new Float32Array(total);
      let off = 0;
      for (const c of chunks) { merged.set(c, off); off += c.length; }
      const down = downsampleTo16k(merged, sampleRate);
      const pcm16 = floatTo16BitPCM(down);
      const wav = encodeWav(pcm16, 16000);
      const audio_b64 = b64FromArrayBuffer(wav);
      message("Sending utterance " + utteranceId + "…");
      ensureCrossLang();
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: "lang",
          input_lang: $("inLang").value,
          output_lang: $("outLang").value,
        }));
        ws.send(JSON.stringify({
          type: "audio_utterance",
          utterance_id: utteranceId,
          start_time: startTime || (Date.now() / 1000),
          mime: "audio/wav",
          sample_rate: 16000,
          audio_b64,
          input_lang: $("inLang").value,
          output_lang: $("outLang").value,
        }));
      }
    }

    function pushRing(frame, frameMs) {
      vadRing.push(frame);
      vadRingMs += frameMs;
      while (vadRingMs > VAD_PREFIX_MS + 40 && vadRing.length > 1) {
        const dropped = vadRing.shift();
        vadRingMs -= (dropped.length / sampleRate) * 1000;
      }
    }

    function onVadFrame(input) {
      const frame = new Float32Array(input);
      const frameMs = (frame.length / sampleRate) * 1000;
      const energy = rmsOf(frame);

      // Echo gate: ignore soft energy while TTS plays; loud = barge-in
      if (echoSuppress) {
        pushRing(frame, frameMs);
        if (energy >= VAD_BARGE_RMS) {
          const uid = uuidUtterance();
          stopLocalTts("barge_in");
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: "barge_in", utterance_id: uid }));
          }
          vadSpeaking = true;
          vadUtteranceId = uid;
          vadStartTime = Date.now() / 1000;
          vadSpeechMs = 0;
          vadSilenceMs = 0;
          pcmChunks = vadRing.map((c) => new Float32Array(c));
          claimAccepted = true;
          setMic(true);
          message("Barge-in — TTS stopped. Listening…");
          updateHoldLabel();
        }
        return;
      }

      if (!youMaySpeak && !vadSpeaking && fsmState !== "IDLE" && !String(fsmState).startsWith("LISTENING_" + role)) {
        // Floor held by partner — still detect overlap for logging
        if (energy >= VAD_SPEECH_RMS) {
          const uid = uuidUtterance();
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: "speech_start", utterance_id: uid }));
          }
        }
        return;
      }

      pushRing(frame, frameMs);

      if (!vadSpeaking) {
        if (energy >= VAD_SPEECH_RMS) {
          const uid = uuidUtterance();
          vadSpeaking = true;
          vadUtteranceId = uid;
          vadStartTime = Date.now() / 1000;
          vadSpeechMs = 0;
          vadSilenceMs = 0;
          pcmChunks = vadRing.map((c) => new Float32Array(c));
          claimAccepted = false;
          setMic(true);
          updateHoldLabel();
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: "speech_start", utterance_id: uid }));
            ws.send(JSON.stringify({ type: "mic", active: true }));
          }
          message("Speech detected — keep talking; pause to send.");
        }
        return;
      }

      // In utterance
      pcmChunks.push(frame);
      if (energy >= VAD_SPEECH_RMS * 0.7) {
        vadSpeechMs += frameMs;
        vadSilenceMs = 0;
      } else {
        vadSilenceMs += frameMs;
      }

      if (vadSilenceMs >= VAD_SILENCE_MS && vadSpeechMs >= VAD_MIN_SPEECH_MS) {
        finalizeVadUtterance();
      }
    }

    function finalizeVadUtterance() {
      if (!vadSpeaking) return;
      const uid = vadUtteranceId || uuidUtterance();
      const start = vadStartTime;
      const chunks = pcmChunks.slice();
      vadSpeaking = false;
      vadUtteranceId = null;
      pcmChunks = [];
      vadSpeechMs = 0;
      vadSilenceMs = 0;
      setMic(false);
      updateHoldLabel();
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: "mic", active: false }));
      }
      if (!claimAccepted && fsmState === "OVERLAP") {
        message("Overlap — your speech was flagged as interruption.", true);
        return;
      }
      sendUtteranceFromChunks(chunks, uid, start);
    }

    async function startContinuous() {
      if (continuous) return;
      await ensureMic();
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      sampleRate = audioCtx.sampleRate;
      if (!processor) {
        sourceNode = audioCtx.createMediaStreamSource(mediaStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);
        muteGain = audioCtx.createGain();
        muteGain.gain.value = 0;
        processor.onaudioprocess = (e) => {
          if (!continuous && !recording) return;
          const input = e.inputBuffer.getChannelData(0);
          if (mode === "vad" && continuous) onVadFrame(input);
          else if (mode === "ptt" && recording) pcmChunks.push(new Float32Array(input));
        };
        sourceNode.connect(processor);
        processor.connect(muteGain);
        muteGain.connect(audioCtx.destination);
      }
      continuous = true;
      updateHoldLabel();
      message("Continuous listening on. Speak naturally; pause ~1s to finalize.");
    }

    function stopContinuous() {
      if (vadSpeaking) finalizeVadUtterance();
      continuous = false;
      updateHoldLabel();
      message("Listening paused.");
    }

    async function startHold() {
      if (mode !== "ptt" || recording || !connected) return;
      try {
        await ensureMic();
        if (!continuous) await startContinuous();
        pcmChunks = [];
        recording = true;
        const uid = uuidUtterance();
        vadUtteranceId = uid;
        vadStartTime = Date.now() / 1000;
        updateHoldLabel();
        setMic(true);
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "speech_start", utterance_id: uid }));
          ws.send(JSON.stringify({ type: "mic", active: true }));
        }
        message("Listening… release to translate.");
      } catch (err) {
        console.error(err);
        message("Microphone permission is required.\n\n" + (err && err.message ? err.message : ""), true);
      }
    }

    function stopHold() {
      if (mode !== "ptt" || !recording) return;
      recording = false;
      updateHoldLabel();
      setMic(false);
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "mic", active: false }));
      const uid = vadUtteranceId || uuidUtterance();
      const start = vadStartTime;
      const chunks = pcmChunks.slice();
      pcmChunks = [];
      vadUtteranceId = null;
      sendUtteranceFromChunks(chunks, uid, start);
    }

    function connect() {
      setStatus("Connecting…", "warn");
      ws = new WebSocket(wsUrl());
      ws.onopen = () => {
        connected = true;
        setStatus("Connected", "on");
        $("holdBtn").disabled = false;
        message("Connected. Enable listening, then speak.");
      };
      ws.onclose = () => {
        connected = false;
        reconnectGeneration += 1;
        stopLocalTts("disconnect");
        setStatus("Reconnecting…", "warn");
        $("holdBtn").disabled = true;
        message("Disconnected. Session state kept — reconnecting without replaying stale audio…", true);
        setTimeout(connect, 1500);
      };
      ws.onerror = () => message("WebSocket error", true);
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "hello") {
          $("partner").textContent = "PHONE " + msg.partner + (msg.partner_connected ? " (online)" : " (offline)");
          if (msg.input_lang) $("inLang").value = msg.input_lang;
          if (msg.output_lang) $("outLang").value = msg.output_lang;
          if (msg.fsm && msg.fsm.fsm_state) setFsm(msg.fsm.fsm_state);
          ensureCrossLang();
          sendLang();
          message(
            "Half-duplex mode. You speak " + $("inLang").value +
            "; partner hears " + $("outLang").value + ".\nEnable listening to start."
          );
          if (msg.stt && !msg.stt.ready) {
            message("STT loading on laptop: " + (msg.stt.error || "please wait"), true);
          }
        }
        if (msg.type === "session_state") {
          setFsm(msg.fsm_state || msg.phase);
          youMaySpeak = msg.you_may_speak !== false;
          setEcho(!!msg.echo_suppress);
        }
        if (msg.type === "speech_ack") {
          claimAccepted = msg.claim === "ACCEPTED" || msg.claim === "BARGE_IN";
          if (msg.claim === "OVERLAP_REJECTED") {
            message("Overlap: partner started first — your turn flagged as interruption.", true);
            vadSpeaking = false;
            pcmChunks = [];
            setMic(false);
            updateHoldLabel();
          } else if (msg.claim === "ECHO_SUPPRESSED") {
            message("Echo suppressed (heard translated TTS).", true);
            vadSpeaking = false;
            pcmChunks = [];
          } else if (msg.claim === "BUSY") {
            message("Partner turn in progress — wait for IDLE.", true);
            vadSpeaking = false;
            pcmChunks = [];
          }
          if (msg.fsm_state) setFsm(msg.fsm_state);
        }
        if (msg.type === "overlap") {
          message(msg.detail || "Overlap detected", true);
        }
        if (msg.type === "stop_tts") {
          stopLocalTts("barge_in");
          message("TTS interrupted (barge-in).");
        }
        if (msg.type === "lang") {
          if (msg.input_lang) $("inLang").value = msg.input_lang;
          if (msg.output_lang) $("outLang").value = msg.output_lang;
        }
        if (msg.type === "status") {
          if (msg.fsm_state) setFsm(msg.fsm_state);
          if (msg.phase === "processing") message("Processing on laptop…");
          if (msg.phase === "partner_speaking") setRecv(true);
        }
        if (msg.type === "tts_audio") {
          playBase64Audio(
            msg.audio_b64,
            msg.audio_format || "wav",
            msg.translated_text || msg.normalized_text || "",
            msg.utterance_id
          );
          message("Partner speech:\n" + (msg.translated_text || msg.normalized_text || ""));
        }
        if (msg.type === "tts_failed") {
          $("retryBtn").style.display = "block";
          lastFailedUtteranceId = msg.utterance_id || lastFailedUtteranceId;
          message(
            "TTS failed — translated text:\n" + (msg.translated_text || "") +
            "\n\nTap Retry to resynthesize.",
            true
          );
        }
        if (msg.type === "utterance_text") {
          message("Partner (text only):\n" + (msg.transcript || msg.detail || ""));
        }
        if (msg.type === "utterance_result") {
          if (msg.ok) {
            latencies.push(msg.latency_sec);
            const avg = latencies.reduce((a, b) => a + b, 0) / latencies.length;
            $("lat").textContent =
              `Last: ${msg.latency_sec.toFixed(2)}s · avg ${avg.toFixed(2)}s\n` +
              `STT ${msg.stt_ms}ms · Translate+TTS ${msg.pipeline_ms}ms\n` +
              `id ${msg.utterance_id || ""} · ${msg.source_language || ""} → ${msg.target_lang || ""}`;
            message(
              "You said:\n" + msg.source_text +
              "\n\nPartner heard (" + (msg.target_lang || $("outLang").value) + "):\n" +
              msg.translated_text
            );
            $("retryBtn").style.display = "none";
          } else {
            lastFailedUtteranceId = msg.utterance_id || lastFailedUtteranceId;
            if (msg.retryable) $("retryBtn").style.display = "block";
            message(
              "Failed: " + (msg.error || "unknown") +
              (msg.transcript ? ("\n\nPreserved ASR:\n" + msg.transcript) : ""),
              true
            );
          }
        }
        if (msg.type === "replaced") message(msg.detail || "Connection replaced", true);
        if (msg.type === "session_ended") {
          message("Session ended on laptop.", true);
          setStatus("Disconnected", "");
          stopContinuous();
        }
        if (msg.type === "error") message(msg.detail || "error", true);
      };
    }

    function sendLang() {
      if (!ws || ws.readyState !== 1) return;
      ensureCrossLang();
      ws.send(JSON.stringify({
        type: "lang",
        input_lang: $("inLang").value,
        output_lang: $("outLang").value,
      }));
    }

    function ensureCrossLang() {
      const inn = ($("inLang").value || "").toLowerCase();
      const out = ($("outLang").value || "").toLowerCase();
      const inEn = inn === "en" || inn === "auto";
      const inTa = inn === "ta" || inn === "tanglish";
      if (out === "en" && inEn) $("outLang").value = "tanglish";
      else if ((out === "ta" || out === "tanglish") && inTa) $("outLang").value = "en";
    }

    $("inLang").onchange = sendLang;
    $("outLang").onchange = sendLang;

    $("modeVad").onclick = () => {
      mode = "vad";
      $("modeVad").classList.add("on");
      $("modePtt").classList.remove("on");
      updateHoldLabel();
    };
    $("modePtt").onclick = () => {
      mode = "ptt";
      if (vadSpeaking) finalizeVadUtterance();
      $("modePtt").classList.add("on");
      $("modeVad").classList.remove("on");
      updateHoldLabel();
    };

    const btn = $("holdBtn");
    btn.addEventListener("pointerdown", async (e) => {
      e.preventDefault();
      if (mode === "ptt") startHold();
      else {
        try {
          if (!continuous) await startContinuous();
          else stopContinuous();
        } catch (err) {
          message(String(err && err.message || err), true);
        }
      }
    });
    btn.addEventListener("pointerup", (e) => { e.preventDefault(); if (mode === "ptt") stopHold(); });
    btn.addEventListener("pointercancel", (e) => { e.preventDefault(); if (mode === "ptt") stopHold(); });
    btn.addEventListener("pointerleave", (e) => { if (mode === "ptt" && recording) stopHold(); });

    $("unlockBtn").onclick = async () => {
      try {
        await ensureMic();
        await unlockAudio();
        message("Microphone and audio unlocked.");
      } catch (err) {
        message("Microphone permission is required.", true);
      }
    };

    $("retryBtn").onclick = () => {
      if (!lastFailedUtteranceId || !ws || ws.readyState !== 1) return;
      ws.send(JSON.stringify({ type: "retry_utterance", utterance_id: lastFailedUtteranceId }));
      message("Retrying utterance " + lastFailedUtteranceId + "…");
    };

    $("playRecvBtn").onclick = async () => {
      if (!pendingRecv) return;
      try {
        await unlockAudio();
        activePlayUtterance = pendingRecv.utteranceId || null;
        setEcho(true);
        setRecv(true);
        if (ws && ws.readyState === 1 && activePlayUtterance) {
          ws.send(JSON.stringify({ type: "tts_started", utterance_id: activePlayUtterance }));
        }
        await playViaElement(pendingRecv.url);
        $("playRecvBtn").style.display = "none";
        setRecv(false);
        setEcho(false);
        if (ws && ws.readyState === 1 && activePlayUtterance) {
          ws.send(JSON.stringify({ type: "tts_done", utterance_id: activePlayUtterance }));
        }
        activePlayUtterance = null;
      } catch (err) {
        message("Still blocked: " + err, true);
      }
    };

    if (!sessionId || !role || !token || (role !== "A" && role !== "B")) {
      message("Invalid QR link. Scan again from the laptop dashboard.", true);
      setStatus("Invalid", "");
    } else {
      connect();
    }
  </script>
</body>
</html>
